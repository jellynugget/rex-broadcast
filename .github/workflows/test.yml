name: test

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT and ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit shellcheck
      - name: Run tests
        run: bash test/run.sh
